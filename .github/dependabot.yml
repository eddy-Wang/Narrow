version: 2
updates:
  - package-ecosystem: pip
    directory: /narrow-shopping-agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: openai
        versions: [">=3"]
      - dependency-name: pytest
        versions: [">=9"]
      - dependency-name: sentence-transformers
        versions: [">=6"]
    groups:
      python-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /demo-frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      workbench-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /trace-visualizer
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      trace-viewer-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      actions-non-major:
        patterns: ["*"]
        update-types: [minor, patch]
