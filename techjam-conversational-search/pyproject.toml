[project]
name = "techjam-shopping-agent"
version = "0.1.0"
description = "Conversational product retrieval agent for the TechJam challenge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.5.3,<1",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
anthropic = ["langchain-anthropic>=1,<2"]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_agent"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
